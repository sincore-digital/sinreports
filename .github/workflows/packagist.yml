name: Update Packagist

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  update-packagist:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist update
        run: |
          curl -X POST 'https://packagist.org/api/update-package' \
            -H 'Content-Type: application/json' \
            -d "{\"username\": \"${{ secrets.PACKAGIST_USERNAME }}\", \"apiToken\": \"${{ secrets.PACKAGIST_TOKEN }}\", \"repository\": {\"url\": \"https://github.com/${{ github.repository }}\"}}"